<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TruSkill | LMS Extractor</title>
    <link rel="icon" type="image/png" href="/logo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased h-screen overflow-hidden flex flex-col">
    <div id="root" class="h-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Authentication States
            const [hasSuperAdmin, setHasSuperAdmin] = useState(null);
            const [currentUser, setCurrentUser] = useState(null);
            const [token, setToken] = useState(localStorage.getItem('lms_token') || '');
            const [activeTab, setActiveTab] = useState('extractor'); // 'extractor' or 'admin'
            
            // Login / Setup Form States
            const [authName, setAuthName] = useState('');
            const [authUsername, setAuthUsername] = useState('');
            const [authPassword, setAuthPassword] = useState('');
            const [authError, setAuthError] = useState('');
            const [authLoading, setAuthLoading] = useState(false);

            // Extractor States
            const [file, setFile] = useState(null);
            const [qStart, setQStart] = useState(26);
            const [qEnd, setQEnd] = useState(32);
            const [sStart, setSStart] = useState(32);
            const [sEnd, setSEnd] = useState(40);
            const [qIndexStart, setQIndexStart] = useState(1);
            const [qIndexEnd, setQIndexEnd] = useState(50);
            const [sIndexStart, setSIndexStart] = useState(1);
            const [sIndexEnd, setSIndexEnd] = useState(50);
            const [engine, setEngine] = useState('python');
            const [topMargin, setTopMargin] = useState(0);
            const [bottomMargin, setBottomMargin] = useState(0);
            const [columns, setColumns] = useState(1);
            const [showMarginModal, setShowMarginModal] = useState(false);
            const [previewData, setPreviewData] = useState(null);
            const [loadingPreview, setLoadingPreview] = useState(false);
            const [draggingLine, setDraggingLine] = useState(null);
            const [subject, setSubject] = useState('Maths > Quantitative > Average');
            const [marks, setMarks] = useState(2.0);
            const [negative, setNegative] = useState(0.6);
            const [difficulty, setDifficulty] = useState('Medium');
            const [qType, setQType] = useState('Single');
            const isSubjectValid = subject && !subject.startsWith(' ') && !subject.endsWith(' ') && !subject.includes('  >') && !subject.includes('>  ') && (subject.match(/>/g) || []).length === (subject.match(/ > /g) || []).length;

            const [isValidating, setIsValidating] = useState(false);
            const [validationResult, setValidationResult] = useState(null);
            const [filePath, setFilePath] = useState('');
            const [isExtracting, setIsExtracting] = useState(false);
            const [extractProgress, setExtractProgress] = useState(0);
            const [extractMessage, setExtractMessage] = useState('');
            const [downloadFiles, setDownloadFiles] = useState(null);

            // Admin States
            const [adminSubTab, setAdminSubTab] = useState('users'); // 'users', 'logs', 'settings'
            const [usersList, setUsersList] = useState([]);
            const [newUserName, setNewUserName] = useState('');
            const [newUserUsername, setNewUserUsername] = useState('');
            const [newUserPassword, setNewUserPassword] = useState('');
            const [adminLogs, setAdminLogs] = useState([]);
            
            // AI Provider States
            const [activeAiProvider, setActiveAiProvider] = useState('gemini');
            const [geminiKeyInput, setGeminiKeyInput] = useState('');
            const [showGeminiKey, setShowGeminiKey] = useState(false);
            const [geminiStatus, setGeminiStatus] = useState(null);
            const [groqKeyInput, setGroqKeyInput] = useState('');
            const [showGroqKey, setShowGroqKey] = useState(false);
            const [groqStatus, setGroqStatus] = useState(null);
            
            const [models, setModels] = useState([]);
            const [geminiModel, setGeminiModel] = useState('gemini-2.5-flash-lite');
            const [groqModel, setGroqModel] = useState('qwen/qwen3.8-27b');
            const [loadingModels, setLoadingModels] = useState(false);
            const [sandboxFile, setSandboxFile] = useState(null);
            const [sandboxMode, setSandboxMode] = useState('questions');
            const [sandboxResult, setSandboxResult] = useState(null);
            const [sandboxLoading, setSandboxLoading] = useState(false);
            const [adminMsg, setAdminMsg] = useState('');
            const [configModal, setConfigModal] = useState(null); // 'gemini' | 'groq' | null
            const [savingConfig, setSavingConfig] = useState(false);

            // Helper for authenticated requests
            const authHeaders = () => ({
                'Authorization': `Bearer ${token}`
            });

            // Check initial auth status
            const checkAuthStatus = async () => {
                try {
                    const headers = token ? authHeaders() : {};
                    const res = await fetch('/api/auth/status', { headers });
                    const data = await res.json();
                    setHasSuperAdmin(data.has_super_admin);
                    if (data.authenticated) {
                        setCurrentUser(data.user);
                    } else {
                        setCurrentUser(null);
                        localStorage.removeItem('lms_token');
                        setToken('');
                    }
                } catch (e) {
                    console.error("Auth check failed:", e);
                }
            };

            useEffect(() => {
                checkAuthStatus();
            }, [token]);

            // Setup Initial Super Admin
            const handleSetupAdmin = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                setAuthError('');
                try {
                    const res = await fetch('/api/auth/setup-admin', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: authName, username: authUsername, password: authPassword })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Setup failed");
                    localStorage.setItem('lms_token', data.token);
                    setToken(data.token);
                    setCurrentUser(data.user);
                    setHasSuperAdmin(true);
                } catch (err) {
                    setAuthError(err.message);
                }
                setAuthLoading(false);
            };

            // Login
            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthLoading(true);
                setAuthError('');
                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: authUsername, password: authPassword })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Invalid credentials");
                    localStorage.setItem('lms_token', data.token);
                    setToken(data.token);
                    setCurrentUser(data.user);
                } catch (err) {
                    setAuthError(err.message);
                }
                setAuthLoading(false);
            };

            // Logout
            const handleLogout = async () => {
                try {
                    await fetch('/api/auth/logout', { method: 'POST', headers: authHeaders() });
                } catch (e) {}
                localStorage.removeItem('lms_token');
                setToken('');
                setCurrentUser(null);
                setActiveTab('extractor');
            };

            // Fetch Admin Data
            const fetchAdminData = async () => {
                if (!currentUser || currentUser.role !== 'super_admin') return;
                try {
                    if (adminSubTab === 'users') {
                        const res = await fetch('/api/admin/users', { headers: authHeaders() });
                        if (res.ok) setUsersList(await res.json());
                    } else if (adminSubTab === 'logs') {
                        const res = await fetch('/api/admin/logs', { headers: authHeaders() });
                        if (res.ok) setAdminLogs(await res.json());
                    } else if (adminSubTab === 'settings') {
                        const res = await fetch('/api/admin/settings', { headers: authHeaders() });
                        if (res.ok) {
                            const data = await res.json();
                            setGeminiStatus(data);
                            if (data.gemini_full_key) setGeminiKeyInput(data.gemini_full_key);
                            if (data.groq_full_key) setGroqKeyInput(data.groq_full_key);
                            if (data.active_ai_provider) setActiveAiProvider(data.active_ai_provider);
                            if (data.gemini_model) setGeminiModel(data.gemini_model);
                            if (data.groq_model) setGroqModel(data.groq_model);
                        }
                    }
                } catch (err) {
                    console.error("Admin fetch error:", err);
                }
            };

            useEffect(() => {
                if (activeTab === 'admin') fetchAdminData();
            }, [activeTab, adminSubTab]);

            // Admin Add User
            const handleAddUser = async (e) => {
                e.preventDefault();
                setAdminMsg('');
                try {
                    const res = await fetch('/api/admin/users', {
                        method: 'POST',
                        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: newUserName, username: newUserUsername, password: newUserPassword })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Could not add user");
                    setAdminMsg("User added successfully!");
                    setNewUserName('');
                    setNewUserUsername('');
                    setNewUserPassword('');
                    fetchAdminData();
                } catch (err) {
                    alert(err.message);
                }
            };

            // Admin Delete User
            const handleDeleteUser = async (userId) => {
                if (!confirm("Are you sure you want to delete this user?")) return;
                try {
                    const res = await fetch(`/api/admin/users/${userId}`, { method: 'DELETE', headers: authHeaders() });
                    if (!res.ok) {
                        const data = await res.json();
                        throw new Error(data.detail || "Failed to delete");
                    }
                    fetchAdminData();
                } catch (err) {
                    alert(err.message);
                }
            };

            // Admin Save Gemini Key

            const fetchModels = async () => {
                setLoadingModels(true);
                try {
                    const res = await fetch('/api/admin/models', { headers: authHeaders() });
                    if (res.ok) {
                        setModels(await res.json());
                    } else {
                        const err = await res.json();
                        alert("Error fetching models: " + err.detail);
                    }
                } catch (err) {
                    console.error(err);
                }
                setLoadingModels(false);
            };

            const exportLogsExcel = () => {
                if(!adminLogs.length) return alert('No logs to export');
                let csv = 'Timestamp,User,File,Model,AI Pages,In Tokens,Out Tokens,Total Tokens,Est. Cost\n';
                adminLogs.forEach(log => {
                    csv += `"${new Date(log.created_at).toLocaleString()}","${log.user_name}","${log.pdf_name}","${log.model_used||''}","${log.pages_count}","${log.input_tokens}","${log.output_tokens}","${log.total_tokens}","${log.estimated_cost}"\n`;
                });
                const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "Audit_Logs.csv";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleSandboxTest = async (e) => {
                e.preventDefault();
                if (!sandboxFile) return alert("Please upload an image first");
                setSandboxLoading(true);
                setSandboxResult(null);
                try {
                    const formData = new FormData();
                    formData.append('file', sandboxFile);
                    formData.append('mode', sandboxMode);
                    
                    const res = await fetch('/api/admin/test-model', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail);
                    setSandboxResult(data);
                } catch(err) {
                    alert(err.message);
                }
                setSandboxLoading(false);
            };
            const handleSetActiveProvider = async (provider) => {
                setActiveAiProvider(provider);
                setAdminMsg('');
                try {
                    const res = await fetch('/api/admin/settings', {
                        method: 'POST',
                        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            gemini_api_key: geminiKeyInput, 
                            groq_api_key: groqKeyInput,
                            active_ai_provider: provider,
                            gemini_model: geminiModel,
                            groq_model: groqModel
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Failed to switch active provider");
                    setAdminMsg(`Active AI Engine switched to ${provider === 'gemini' ? 'Google Gemini' : 'Groq Vision'}`);
                    fetchAdminData();
                } catch (err) {
                    alert(err.message);
                }
            };

            const handleSaveProviderConfig = async (providerToSave) => {
                setSavingConfig(true);
                setAdminMsg('');
                try {
                    const res = await fetch('/api/admin/settings', {
                        method: 'POST',
                        headers: { ...authHeaders(), 'Content-Type': 'application/json' },
                        body: JSON.stringify({ 
                            gemini_api_key: geminiKeyInput, 
                            groq_api_key: groqKeyInput,
                            active_ai_provider: activeAiProvider,
                            gemini_model: geminiModel,
                            groq_model: groqModel
                        })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Failed to save configuration");
                    setAdminMsg(`${providerToSave === 'gemini' ? 'Google Gemini' : 'Groq Vision'} configuration saved successfully!`);
                    setConfigModal(null);
                    fetchAdminData();
                } catch (err) {
                    alert(err.message);
                }
                setSavingConfig(false);
            };

            // Extractor Logic
            const handleFile = (e) => {
                setFile(e.target.files[0]);
                setValidationResult(null);
                setDownloadFiles(null);
            };

            const loadPagePreview = async (pageNum) => {
                if (!file) return;
                setLoadingPreview(true);
                try {
                    const formData = new FormData();
                    formData.append("file", file);
                    formData.append("page_num", pageNum || qStart);
                    const res = await fetch("/api/extract/preview-page", {
                        method: "POST",
                        headers: authHeaders(),
                        body: formData
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Failed to load page preview");
                    setPreviewData(data);
                } catch (err) {
                    alert("Preview Error: " + err.message);
                }
                setLoadingPreview(false);
            };

            const openMarginModal = () => {
                if (!file) return alert("Please upload a PDF file first.");
                setShowMarginModal(true);
                loadPagePreview(qStart);
            };

            const runPreFlightCheck = async () => {
                if (!file) return alert("Please upload a PDF first.");
                setIsValidating(true);
                const formData = new FormData();
                formData.append("file", file);
                formData.append("q_start", qStart);
                formData.append("q_end", qEnd);
                formData.append("s_start", sStart);
                formData.append("s_end", sEnd);
                formData.append("q_index_start", qIndexStart);
                formData.append("q_index_end", qIndexEnd);
                formData.append("s_index_start", sIndexStart);
                formData.append("s_index_end", sIndexEnd);
                formData.append("top_margin_pct", topMargin);
                formData.append("bottom_margin_pct", bottomMargin);
                formData.append("columns", columns);
                
                try {
                    const res = await fetch("/api/validate", { method: "POST", headers: authHeaders(), body: formData });
                    if (!res.ok) throw new Error("Validation check failed.");
                    const data = await res.json();
                    setValidationResult(data);
                    setFilePath(data.file_path);
                } catch (err) {
                    alert("Validation Error: " + err.message);
                }
                setIsValidating(false);
            };

            const startExtraction = async () => {
                setIsExtracting(true);
                setDownloadFiles(null);
                const formData = new FormData();
                formData.append("file", file);
                formData.append("q_start", qStart);
                formData.append("q_end", qEnd);
                formData.append("s_start", sStart);
                formData.append("s_end", sEnd);
                formData.append("q_index_start", qIndexStart);
                formData.append("q_index_end", qIndexEnd);
                formData.append("s_index_start", sIndexStart);
                formData.append("s_index_end", sIndexEnd);
                formData.append("engine", engine);
                formData.append("subject", subject);
                formData.append("marks", marks);
                formData.append("negative", negative);
                formData.append("difficulty", difficulty);
                formData.append("q_type", qType);
                formData.append("top_margin_pct", topMargin);
                formData.append("bottom_margin_pct", bottomMargin);
                formData.append("columns", columns);

                try {
                    const res = await fetch("/api/extract", { method: "POST", headers: authHeaders(), body: formData });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || "Extraction failed.");
                    setDownloadFiles(data.files);
                } catch (err) {
                    alert(err.message);
                }
                setIsExtracting(false);
            };

            const downloadBase64 = (base64Data, fileName, mimeType) => {
                const byteCharacters = atob(base64Data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                const blob = new Blob([byteArray], {type: mimeType});
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            // Loading state while checking auth
            if (hasSuperAdmin === null) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-900 text-white">
                        <i className="fa-solid fa-circle-notch fa-spin text-4xl text-indigo-500"></i>
                    </div>
                );
            }

            // 1. FIRST-TIME SETUP SCREEN
            if (!hasSuperAdmin) {
                return (
                    <div className="h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 to-indigo-950 p-6">
                        <div className="w-full max-w-md bg-white rounded-2xl shadow-2xl p-8 border border-slate-100">
                            <div className="text-center mb-6">
                                <img src="/logo.png" alt="TruSkill" className="h-10 mx-auto mb-3 rounded-lg px-3 py-1 shadow-lg object-contain" />
                                <h2 className="text-2xl font-black text-slate-800 tracking-tight">Create Super Admin</h2>
                                <p className="text-xs text-slate-500 mt-1">First-time system initialization</p>
                            </div>
                            {authError && <div className="mb-4 p-3 bg-red-50 text-red-700 text-xs rounded-lg border border-red-200">{authError}</div>}
                            <form onSubmit={handleSetupAdmin} className="space-y-4">
                                <div>
                                    <label className="text-[11px] font-bold text-slate-600 uppercase">Your Full Name</label>
                                    <input type="text" required placeholder="e.g. Rahul Sharma" value={authName} onChange={e=>setAuthName(e.target.value)} 
                                        className="w-full mt-1 border border-slate-200 bg-slate-50 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-slate-600 uppercase">Admin Username / ID</label>
                                    <input type="text" required placeholder="admin" value={authUsername} onChange={e=>setAuthUsername(e.target.value)} 
                                        className="w-full mt-1 border border-slate-200 bg-slate-50 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-slate-600 uppercase">Master Password</label>
                                    <input type="password" required placeholder="••••••••" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} 
                                        className="w-full mt-1 border border-slate-200 bg-slate-50 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500" />
                                </div>
                                <button type="submit" disabled={authLoading} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-lg hover:bg-indigo-700 shadow-md transition disabled:opacity-50">
                                    {authLoading ? "Initializing..." : "Create Super Admin & Launch"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // 2. LOGIN SCREEN
            if (!currentUser) {
                return (
                    <div className="h-screen flex items-center justify-center bg-slate-900 p-6">
                        <div className="w-full max-w-sm bg-white rounded-2xl shadow-xl p-8 border border-slate-200">
                            <div className="text-center mb-6">
                                <img src="/logo.png" alt="TruSkill" className="h-10 mx-auto mb-3 rounded-lg px-3 py-1.5 shadow-lg object-contain" />
                                <h2 className="text-2xl font-bold text-slate-900">Sign In</h2>
                                <p className="text-xs text-slate-500">LMS Bulk Extractor Portal</p>
                            </div>
                            {authError && <div className="mb-4 p-2.5 bg-red-50 text-red-700 text-xs rounded-lg border border-red-200">{authError}</div>}
                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="text-[11px] font-bold text-slate-600 uppercase">Username / ID</label>
                                    <input type="text" required placeholder="Enter username" value={authUsername} onChange={e=>setAuthUsername(e.target.value)} 
                                        className="w-full mt-1 border border-slate-200 bg-slate-50 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500" />
                                </div>
                                <div>
                                    <label className="text-[11px] font-bold text-slate-600 uppercase">Password</label>
                                    <input type="password" required placeholder="••••••••" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} 
                                        className="w-full mt-1 border border-slate-200 bg-slate-50 rounded-lg p-2.5 text-sm outline-none focus:border-indigo-500" />
                                </div>
                                <button type="submit" disabled={authLoading} className="w-full py-2.5 bg-slate-900 text-white font-bold rounded-lg hover:bg-slate-800 shadow transition disabled:opacity-50">
                                    {authLoading ? "Signing in..." : "Login to Portal"}
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            // 3. AUTHENTICATED APP SHELL
            return (
                <div className="flex flex-col h-full">
                    {/* Top Navigation Bar */}
                    <div className="bg-white border-b border-slate-200 px-6 py-2.5 flex items-center justify-between shrink-0 shadow-sm z-10">
                        <div className="flex items-center gap-6">
                            <div className="flex items-center gap-3">
                                <img src="/logo.png" alt="TruSkill" className="h-7 rounded-md px-2 py-0.5 shadow-sm object-contain" />
                                <span className="text-xs font-bold text-slate-400 tracking-wider uppercase border-l border-slate-200 pl-3">LMS Extractor</span>
                            </div>
                            {/* Navigation Tabs (Only for Super Admin) */}
                            {currentUser.role === 'super_admin' && (
                                <div className="flex bg-slate-100 p-1 rounded-lg border border-slate-200 text-xs">
                                    <button onClick={()=>setActiveTab('extractor')} 
                                        className={`px-3 py-1 rounded-md font-bold transition ${activeTab==='extractor'?'bg-white text-indigo-700 shadow-sm':'text-slate-600 hover:text-slate-900'}`}>
                                        <i className="fa-solid fa-file-export mr-1.5"></i>Extractor
                                    </button>
                                    <button onClick={()=>setActiveTab('admin')} 
                                        className={`px-3 py-1 rounded-md font-bold transition ${activeTab==='admin'?'bg-white text-indigo-700 shadow-sm':'text-slate-600 hover:text-slate-900'}`}>
                                        <i className="fa-solid fa-shield-halved mr-1.5"></i>Super Admin
                                    </button>
                                </div>
                            )}
                        </div>

                        {/* User Profile & Logout */}
                        <div className="flex items-center gap-3">
                            <div className="text-right">
                                <div className="text-xs font-bold text-slate-800">{currentUser.name}</div>
                                <div className="text-[10px] text-slate-400 capitalize">{currentUser.role === 'super_admin' ? '👑 Super Admin' : 'Standard User'}</div>
                            </div>
                            <button onClick={handleLogout} title="Sign Out" className="p-2 text-slate-400 hover:text-red-600 transition text-sm">
                                <i className="fa-solid fa-arrow-right-from-bracket"></i>
                            </button>

                                        </div>

                                        <div className="pt-4 border-t border-slate-200">
                                            <button 
                                                type="button" 
                                                onClick={() => setShowMarginModal(false)} 
                                                className="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-200 transition">
                                                <i className="fa-solid fa-check mr-2"></i> Save & Apply to All Pages
                                            </button>
                                        </div>
                                    </div>

                                    {/* Right Canvas / Preview Panel */}
                                    <div className="flex-1 bg-slate-100 p-6 flex flex-col items-center justify-center overflow-auto relative">
                                        {loadingPreview ? (
                                            <div className="flex flex-col items-center gap-3 text-slate-500">
                                                <i className="fa-solid fa-circle-notch fa-spin text-3xl text-indigo-500"></i>
                                                <span className="text-xs font-bold">Rendering page preview...</span>
                                            </div>
                                        ) : previewData ? (
                                            <div className="flex flex-col items-center">
                                                <div className="text-[11px] font-semibold text-slate-500 mb-2">
                                                    Previewing Page {previewData.page_num} of {previewData.total_pages} (Drag the handles on the image or use the sliders)
                                                </div>
                                                
                                                {/* Interactive Page Container */}
                                                <div 
                                                    onMouseMove={(e) => {
                                                        if (!draggingLine) return;
                                                        const rect = e.currentTarget.getBoundingClientRect();
                                                        const y = e.clientY - rect.top;
                                                        const pct = Math.round((y / rect.height) * 100);
                                                        if (draggingLine === 'top') {
                                                            setTopMargin(Math.max(0, Math.min(pct, 40)));
                                                        } else if (draggingLine === 'bottom') {
                                                            const bPct = Math.round(((rect.height - y) / rect.height) * 100);
                                                            setBottomMargin(Math.max(0, Math.min(bPct, 40)));
                                                        }
                                                    }}
                                                    onMouseUp={() => setDraggingLine(null)}
                                                    onMouseLeave={() => setDraggingLine(null)}
                                                    className="relative shadow-2xl border border-slate-300 rounded overflow-hidden select-none bg-white max-h-[70vh]">
                                                    
                                                    <img 
                                                        src={previewData.image} 
                                                        alt="Page Preview" 
                                                        className="max-h-[70vh] object-contain pointer-events-none block" />

                                                    {/* Top Excluded Shaded Area */}
                                                    <div 
                                                        style={{ top: 0, height: `${topMargin}%`, left: 0, right: 0 }}
                                                        className="absolute bg-rose-500/25 border-b-2 border-rose-500 pointer-events-none flex items-end justify-center pb-1 transition-[height] duration-75">
                                                        {topMargin > 0 && (
                                                            <span className="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">
                                                                Header Excluded ({topMargin}%)
                                                            </span>
                                                        )}
                                                    </div>

                                                    {/* Top Draggable Handle Line */}
                                                    <div 
                                                        onMouseDown={(e) => { e.preventDefault(); setDraggingLine('top'); }}
                                                        style={{ top: `${topMargin}%`, transform: 'translateY(-50%)' }}
                                                        className="absolute left-0 right-0 h-6 cursor-ns-resize flex items-center justify-center z-20 group">
                                                        <div className="w-24 h-2.5 bg-rose-600 hover:bg-rose-700 rounded-full shadow-md border-2 border-white flex items-center justify-center transition">
                                                            <div className="w-6 h-0.5 bg-white rounded"></div>
                                                        </div>
                                                    </div>

                                                    {/* Bottom Excluded Shaded Area */}
                                                    <div 
                                                        style={{ bottom: 0, height: `${bottomMargin}%`, left: 0, right: 0 }}
                                                        className="absolute bg-rose-500/25 border-t-2 border-rose-500 pointer-events-none flex items-start justify-center pt-1 transition-[height] duration-75">
                                                        {bottomMargin > 0 && (
                                                            <span className="bg-rose-600 text-white text-[10px] font-bold px-2 py-0.5 rounded shadow">
                                                                Footer Excluded ({bottomMargin}%)
                                                            </span>
                                                        )}
                                                    </div>

                                                    {/* Bottom Draggable Handle Line */}
                                                    <div 
                                                        onMouseDown={(e) => { e.preventDefault(); setDraggingLine('bottom'); }}
                                                        style={{ bottom: `${bottomMargin}%`, transform: 'translateY(50%)' }}
                                                        className="absolute left-0 right-0 h-6 cursor-ns-resize flex items-center justify-center z-20 group">
                                                        <div className="w-24 h-2.5 bg-rose-600 hover:bg-rose-700 rounded-full shadow-md border-2 border-white flex items-center justify-center transition">
                                                            <div className="w-6 h-0.5 bg-white rounded"></div>
                                                        </div>
                                                    </div>

                                                    {/* 2-Column Vertical Dotted Guide Line */}
                                                    {columns === 2 && (
                                                        <div className="absolute top-0 bottom-0 left-1/2 w-0 border-l-2 border-dashed border-indigo-500 pointer-events-none z-10 flex flex-col justify-between py-6">
                                                            <span className="bg-indigo-600 text-white text-[9px] font-bold px-2 py-0.5 rounded shadow -translate-x-1/2 self-center">
                                                                Col 1 (Left) | Col 2 (Right)
                                                            </span>
                                                            <span className="bg-indigo-600 text-white text-[9px] font-bold px-2 py-0.5 rounded shadow -translate-x-1/2 self-center">
                                                                50% Center Split
                                                            </span>
                                                        </div>
                                                    )}

                                                </div>
                                            </div>
                                        ) : (
                                            <div className="text-xs text-slate-400">Click Set Margins to load preview.</div>
                                        )}
                                    </div>

                                </div>
                            </div>
                        </div>
                    )}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
